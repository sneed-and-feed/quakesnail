[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quakesnail"
version = "0.1.0"
description = "QuakeSnail: Next-generation real-time earthquake monitoring, phase-association, 3D travel-time hypocenter inversion, and EEW tactical studio"
authors = [{ name = "Noah Cohen" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
quakesnail = "quakesnail.__main__:main"

[project.urls]
Homepage = "https://github.com/sneed-and-feed/quakesnail"
Repository = "https://github.com/sneed-and-feed/quakesnail"

[tool.setuptools.packages.find]
where = ["."]
include = ["quakesnail*"]

[tool.setuptools.package-data]
quakesnail = ["*.dll", "*.so", "*.dylib"]
"quakesnail.studio" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

